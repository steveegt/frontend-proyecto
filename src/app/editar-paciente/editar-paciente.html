<!-- NAVBAR -->
<div class="navbar">
  <img src="/logo.png" class="logo">

  <button mat-button color="accent" (click)="volver()">
    ← Volver
  </button>
</div>

<div class="contenido">

  <h2>Editar Paciente</h2>

  <!-- 🔍 BUSCADOR -->
  <div class="buscador">
    <mat-form-field appearance="outline">
      <mat-label>Buscar paciente</mat-label>
      <input matInput [(ngModel)]="nombreBusqueda">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="buscar()">
      Buscar
    </button>
  </div>

  <!-- 📋 TABLA -->
  <table mat-table [dataSource]="pacientes" class="tabla" *ngIf="pacientes.length > 0">

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let p">{{ p.nombreCompleto }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acción</th>
      <td mat-cell *matCellDef="let p">
        <button mat-button color="primary" (click)="seleccionar(p)">
          Editar
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['nombre','acciones']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['nombre','acciones'];"></tr>

  </table>

  <!-- ✏️ FORMULARIO -->
  <mat-card *ngIf="pacienteSeleccionado" class="formulario">

    <h3>Editar datos</h3>

    <!-- DATOS PACIENTE -->
    <mat-form-field class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput [(ngModel)]="pacienteSeleccionado.nombreCompleto">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Teléfono</mat-label>
      <input matInput [(ngModel)]="pacienteSeleccionado.telefono">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Dirección</mat-label>
      <input matInput [(ngModel)]="pacienteSeleccionado.direccion">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Seguro</mat-label>
      <input matInput [(ngModel)]="pacienteSeleccionado.seguro">
    </mat-form-field>

    <h4>Datos de usuario</h4>

    <!-- ✅ USUARIO -->
    <mat-form-field class="full-width">
      <mat-label>Username</mat-label>
      <input matInput [(ngModel)]="pacienteSeleccionado.username">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Password</mat-label>
      <input matInput [(ngModel)]="pacienteSeleccionado.password" type="password">
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="guardar()">
      Guardar cambios
    </button>

  </mat-card>

</div>
