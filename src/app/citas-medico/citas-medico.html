<!-- NAVBAR -->
<div class="navbar">
  <img src="/logo.png" class="logo">

  <button class="btn-volver" routerLink="/menumedico">
    ← Volver
  </button>
</div>

<!-- CONTENIDO -->
<div class="contenido">

  <!-- 🔹 PENDIENTES -->
  <h2>🟡 Citas Pendientes</h2>

  <div class="tabla-container">

    <table mat-table [dataSource]="citas" class="tabla">

      <!-- PACIENTE -->
      <ng-container matColumnDef="paciente">
        <th mat-header-cell *matHeaderCellDef>Paciente</th>
        <td mat-cell *matCellDef="let c">
          {{ c.paciente?.nombreCompleto }}
        </td>
      </ng-container>

      <!-- FECHA -->
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let c">{{ c.fecha }}</td>
      </ng-container>

      <!-- HORA -->
      <ng-container matColumnDef="hora">
        <th mat-header-cell *matHeaderCellDef>Hora</th>
        <td mat-cell *matCellDef="let c">{{ c.hora }}</td>
      </ng-container>

      <!-- ESTADO -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let c">{{ c.estado }}</td>
      </ng-container>

      <!-- ACCIONES -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let c">

          <button mat-raised-button color="primary" (click)="aceptar(c.id)">
            Aceptar
          </button>

          <button mat-raised-button color="warn" (click)="rechazar(c.id)">
            Rechazar
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </div>

  <!-- 🔹 AGENDADAS -->
  <h2 style="margin-top: 40px;">✅ Citas Agendadas</h2>

  <div class="tabla-container">

    <table mat-table [dataSource]="citasAgendadas" class="tabla">

      <!-- PACIENTE -->
      <ng-container matColumnDef="paciente">
        <th mat-header-cell *matHeaderCellDef>Paciente</th>
        <td mat-cell *matCellDef="let c">
          {{ c.paciente?.nombreCompleto }}
        </td>
      </ng-container>

      <!-- FECHA -->
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let c">{{ c.fecha }}</td>
      </ng-container>

      <!-- HORA -->
      <ng-container matColumnDef="hora">
        <th mat-header-cell *matHeaderCellDef>Hora</th>
        <td mat-cell *matCellDef="let c">{{ c.hora }}</td>
      </ng-container>

      <!-- ESTADO -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let c">{{ c.estado }}</td>
      </ng-container>

      <!-- 🔹 AQUÍ NO HAY ACCIONES -->
      <tr mat-header-row *matHeaderRowDef="['paciente','fecha','hora','estado']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['paciente','fecha','hora','estado'];"></tr>

    </table>

  </div>

</div>
