<!-- NAVBAR -->
<div class="navbar">
  <img src="/logo.png" class="logo">

  <button mat-button color="accent" (click)="volver()">
    ← Volver
  </button>
</div>

<div class="contenido">

  <h2>Editar Médico</h2>

  <!-- 🔍 BUSCADOR CON AUTOCOMPLETE -->
  <div class="buscador">

    <mat-form-field appearance="outline">
      <mat-label>Buscar médico</mat-label>
      <input type="text"
             matInput
             [(ngModel)]="nombreBusqueda"
             [matAutocomplete]="auto">

      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="seleccionar($event.option.value)">
        <mat-option *ngFor="let m of medicos" [value]="m">
          {{ m.nombreCompleto }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="buscar()">
      Buscar
    </button>

  </div>

  <!-- 📋 TABLA -->
  <table mat-table [dataSource]="medicos" class="tabla" *ngIf="medicos.length > 0">

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let m">{{ m.nombreCompleto }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acción</th>
      <td mat-cell *matCellDef="let m">
        <button mat-button color="primary" (click)="seleccionar(m)">
          Editar
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['nombre','acciones']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['nombre','acciones'];"></tr>

  </table>

  <!-- ✏️ FORMULARIO -->
  <mat-card *ngIf="medicoSeleccionado" class="formulario">

    <h3>Editar datos del médico</h3>

    <!-- DATOS MÉDICO -->
    <mat-form-field class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput [(ngModel)]="medicoSeleccionado.nombreCompleto">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Colegiado</mat-label>
      <input matInput [(ngModel)]="medicoSeleccionado.colegiado">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Especialidad</mat-label>
      <input matInput [(ngModel)]="medicoSeleccionado.especialidad">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Dirección</mat-label>
      <input matInput [(ngModel)]="medicoSeleccionado.direccion">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Edad</mat-label>
      <input matInput type="number" [(ngModel)]="medicoSeleccionado.edad">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Observación</mat-label>
      <input matInput [(ngModel)]="medicoSeleccionado.observacion">
    </mat-form-field>

    <h4>Datos de usuario</h4>

    <!-- USUARIO -->
    <mat-form-field class="full-width">
      <mat-label>Username</mat-label>
      <input matInput [(ngModel)]="medicoSeleccionado.username">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Password</mat-label>
      <input matInput type="password" [(ngModel)]="medicoSeleccionado.password">
    </mat-form-field>

    <!-- BOTONES -->
    <div style="display: flex; gap: 10px; margin-top: 15px;">

      <button mat-raised-button color="primary" (click)="guardar()">
        Guardar cambios
      </button>

      <!-- ✅ BOTÓN ELIMINAR -->
      <button mat-raised-button color="warn" (click)="eliminar()">
        Eliminar Médico
      </button>

    </div>

  </mat-card>

</div>
